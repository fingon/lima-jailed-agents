name: Sanity checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: make dep

      - name: Expose pipx applications
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run lint
        run: make lint
