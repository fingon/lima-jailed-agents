# Project settings override named values and replace packages.
packages:
  - ninja-build
  - ninja-build
agents:
  - opencode
  - opencode
copy_git_config: false
github:
  enabled: false
env:
  BUILD_MODE: project
  PROJECT_ONLY: enabled
env_passthrough:
  - TOKEN
  - PROJECT_TOKEN
setup:
  - |
    make test
