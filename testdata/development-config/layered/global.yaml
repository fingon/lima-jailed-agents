# Global defaults are inherited unless the project replaces them.
packages:
  - git
  - make
  - ninja-build
agents:
  - codex
  - claude
  - codex
copy_git_config: true
github:
  enabled: true
  token_command:
    - gh
    - auth
    - token
    - --hostname
    - github.com
env:
  BUILD_MODE: global
  BUILD_COUNT: "2"
  BUILD_ENABLED: "true"
  EMPTY_VALUE: ""
env_passthrough:
  - TOKEN
  - HTTPS_PROXY
setup:
  - |
    make dep
    make build
