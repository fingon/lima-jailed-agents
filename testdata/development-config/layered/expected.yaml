gpg_forwarding: false
github:
  enabled: false
  token_command:
    - gh
    - auth
    - token
    - --hostname
    - github.com
lima: {}
packages:
  - ninja-build
tools: []
agents:
  - opencode
copy_git_config: false
env:
  BUILD_COUNT: "2"
  BUILD_ENABLED: "true"
  BUILD_MODE: project
  EMPTY_VALUE: ""
  PROJECT_ONLY: enabled
env_passthrough:
  - TOKEN
  - HTTPS_PROXY
  - PROJECT_TOKEN
setup:
  - |
    make dep
    make build
  - |
    make test
